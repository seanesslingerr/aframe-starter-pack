
<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
       <img id="sky" src="./assets/sky.jpg">
       <img id="sand" src="./assets/sand.jpg">
       <img id="bark" src="./assets/bark.jpg">
       <img id="leaf" src="./assets/leaf.jpg">
       <img id="ocean" src="./assets/ocean.jpg">
       <img id="beachball" src="./assets/redWhite.jpg">
      </a-assets>

  <a-sky src="#sky"></a-sky>

  <!-- Ocean -->
  <a-plane
    position="0 0 -4"
    rotation="-90 0 0"
    width="200"
    height="200"
    src="#ocean">
  </a-plane>

  <!-- Island base: overlapping sand shapes -->
  <a-cylinder
    position="0 0.05 -4"
    radius="3.2"
    height="0.12"
    scale="1.4 1 1"
    src="#sand">
  </a-cylinder>

  <a-cylinder
    position="1.8 0.051 -3.3"
    radius="2"
    height="0.12"
    scale="1.2 1 0.9"
    src="#sand">
  </a-cylinder>

  <a-cylinder
    position="-1.8 0.052 -4.8"
    radius="1.8"
    height="0.12"
    src="#sand"
    scale="1.1 1 1.3">
  </a-cylinder>

  <a-cylinder
    position="0.6 0.053 -5.8"
    radius="1.5"
    height="0.12"
    scale="1.4 1 0.8"
    src="#sand">
  </a-cylinder>

  <!-- beach ball -->
   <a-sphere
    position="0.5 0.35 -3.5"
    radius="0.4"
    src="#beachball">
  </a-sphere>

  <!-- Palm tree -->
  <a-cylinder
    position="-1 1 -3.8"
    radius="0.12"
    height="2"
    src="#bark">
  </a-cylinder>

  <a-cone
    position="-1 2.2 -3.8"
    radius-bottom="0.9"
    radius-top="0.05"
    height="1"
    rotation="0 0 90"
    src="#leaf">
  </a-cone>

  <a-cone
    position="-1 2.2 -3.8"
    radius-bottom="0.9"
    radius-top="0.05"
    height="1"
    rotation="0 60 90"
    src="#leaf">
  </a-cone>

  <a-cone
    position="-1 2.2 -3.8"
    radius-bottom="0.9"
    radius-top="0.05"
    height="1"
    rotation="0 120 90"
    src="#leaf">
  </a-cone>

  <a-camera position="0 1.6 -1.5"></a-camera>
</a-scene>
  </body>
</html>
